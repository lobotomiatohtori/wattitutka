name: Julkaise verkkosivusto FTP-palvelimelle

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Hae GitHubin tiedostot
        uses: actions/checkout@v4

      - name: Siirra tiedostot FTP-palvelimelle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /wattitutka/
